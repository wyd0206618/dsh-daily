name: cloud-now

# 云端定时抓取，不依赖本地电脑
# cron 用 UTC，北京时间 = UTC + 8
on:
  schedule:
    # 北京时间 08:30 早间
    - cron: "30 0 * * *"
    # 11:00
    - cron: "0 3 * * *"
    # 14:00
    - cron: "0 6 * * *"
    # 15:00
    - cron: "0 7 * * *"
    # 16:00
    - cron: "0 8 * * *"
    # 17:30（欧洲开盘后）
    - cron: "30 9 * * *"
    # 21:35（美国数据刚公布，最关键）
    - cron: "35 13 * * *"
    # 22:35（补延迟）
    - cron: "35 14 * * *"
  # 手机上随时手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      note:
        description: "备注（可留空）"
        required: false
        default: "手动"

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（akshare 只需一次，缓存后快）
        run: |
          python -m pip install --upgrade pip
          pip install akshare

      - name: 抓取并发送
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          python cloud/cloud_now.py --send

      - name: 失败提示
        if: failure()
        run: |
          echo "抓取失败。常见原因："
          echo "1) Secrets 未配置 MAIL_USER / MAIL_PASS"
          echo "2) MAIL_PASS 填成了登录密码（应为 SMTP 授权码）"
          echo "3) 百度日历限流（脚本已内置新闻兜底）"
